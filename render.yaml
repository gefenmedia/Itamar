# Render deployment config
# Note: Render does not support Ollama natively.
# For cloud deployment, either:
#   1. Run Ollama on a separate VM and set OLLAMA_BASE_URL
#   2. Switch to OpenAI by setting LLM_BACKEND=openai + OPENAI_API_KEY
services:
  - type: web
    name: rav-itamar
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rav-itamar-db
          property: connectionString
      - key: LLM_BACKEND
        value: ollama
      - key: OLLAMA_BASE_URL
        sync: false  # Set to your Ollama server URL
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/storage/pdfs
    disk:
      name: pdf-storage
      mountPath: /app/storage/pdfs
      sizeGB: 1

databases:
  - name: rav-itamar-db
    databaseName: rav_itamar
    postgresMajorVersion: "16"
    plan: starter
    ipAllowList: []
