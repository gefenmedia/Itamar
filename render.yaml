# Render deployment config
services:
  - type: web
    name: rav-itamar
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rav-itamar-db
          property: connectionString
        # Note: Replace 'postgresql://' with 'postgresql+asyncpg://' in app config
      - key: OPENAI_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/storage/pdfs
    disk:
      name: pdf-storage
      mountPath: /app/storage/pdfs
      sizeGB: 1

databases:
  - name: rav-itamar-db
    databaseName: rav_itamar
    postgresMajorVersion: "16"
    plan: starter
    ipAllowList: []
